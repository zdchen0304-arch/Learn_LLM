name: autoresearch-lab

services:
  maars-api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: maars-api:local
    environment:
      MAARS_DB_PATH: /data/maars.sqlite3
      MAARS_ARTIFACTS_DIR: /data/artifacts
      MAARS_LOGS_DIR: /data/logs
      MAARS_SANDBOX_DIR: /data/sandbox
      MAARS_SESSION_SECRET: ${MAARS_SESSION_SECRET:?Copy .env.example to .env and set MAARS_SESSION_SECRET}
      # Credentials are injected at runtime from an ignored .env file. They
      # override any browser-saved preset and are never written to SQLite.
      MAARS_API_KEY: ${MAARS_API_KEY:-}
      MAARS_MODEL: ${MAARS_MODEL:-}
      MAARS_API_BASE_URL: ${MAARS_API_BASE_URL:-}
      MAARS_LLM_PROVIDER: ${MAARS_LLM_PROVIDER:-gemini}
      MAARS_CORS_ORIGINS: ${MAARS_CORS_ORIGINS:-http://localhost:3001,http://127.0.0.1:3001}
      MAARS_BACKEND_LOG_LEVEL: ${MAARS_BACKEND_LOG_LEVEL:-INFO}
      MAARS_TASK_WEB_ENABLED: ${MAARS_TASK_WEB_ENABLED:-0}
      MAARS_MOCK_STREAM_DELAY_MS: ${MAARS_MOCK_STREAM_DELAY_MS:-0}
      MAARS_MOCK_EXECUTION_PASS_PROBABILITY: ${MAARS_MOCK_EXECUTION_PASS_PROBABILITY:-1.0}
      MAARS_MOCK_VALIDATION_PASS_PROBABILITY: ${MAARS_MOCK_VALIDATION_PASS_PROBABILITY:-1.0}
      MAARS_DOCKER_IMAGE: ${MAARS_DOCKER_IMAGE:-maars-task-python:local}
    ports:
      - "${MAARS_PORT:-3001}:3001"
    volumes:
      - maars-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 3g
    cpus: 4
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; assert urlopen('http://127.0.0.1:3001/healthz', timeout=3).status == 200"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  task-runtime-image:
    profiles: ["task-runtime"]
    build:
      context: backend/task_agent/docker
      dockerfile: Dockerfile
    image: maars-task-python:local
    command: ["sh", "-lc", "python -c 'import numpy, scipy, pandas, sklearn, joblib; print(\"task runtime ready\")'"]
    restart: "no"

volumes:
  maars-data:
